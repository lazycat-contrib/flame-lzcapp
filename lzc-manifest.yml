application:
  subdomain: flame
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://flame:5005/
  injects:
    - id: login-autofill
      when:
        - /
      do:
        - src: builtin://simple-inject-password
          params:
            user: admin
            password: "{{ .U.login_password }}"
services:
  flame:
    # pawelmalak/flame:2.4.0
    # upstream: pawelmalak/flame:2.4.0
    image: docker.1ms.run/pawelmalak/flame:2.4.0
    environment:
      - PASSWORD={{ .U.login_password }}
    binds:
      - /lzcapp/var/data:/app/data
